[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screen-saathi-backend"
version = "0.1.0"
description = "Screen Saathi backend and spike tooling"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.2",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "python-dotenv==1.2.4",
  "uvicorn==0.54.0",
  "websockets==17.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/screen_saathi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
