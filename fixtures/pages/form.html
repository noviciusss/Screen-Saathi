<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Service request form</title></head>
  <body>
    <main>
      <h1>Service request</h1>
      <p>Use this synthetic form to ask for help with a public service.</p>
      <form id="service-form">
        <label for="resident-name">Resident name</label>
        <input id="resident-name" name="resident-name" type="text" placeholder="Your name" required>
        <label for="service-type">Service type</label>
        <select id="service-type" name="service-type"><option>Water connection</option><option>Street light</option></select>
        <button type="submit">Send request</button>
      </form>
    </main>
  </body>
</html>
